<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우주 라벤더 스테이션</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@300;400;600&display=swap');

    :root {
      --space-bg: #05050a;
      --nebula-glow: #2d1b4d;
      --neon-cyan: #00f2ff;
      --neon-purple: #bc13fe;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at 50% 50%, var(--nebula-glow) 0%, var(--space-bg) 80%);
      color: #e0e0ff; min-height: 100vh; overflow-x: hidden;
    }

    /* 배경 별빛 애니메이션 */
    .stars {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
      background-image: radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)), radial-gradient(1px 1px at 50px 160px, #fff, rgba(0,0,0,0));
      background-size: 200px 200px; animation: moveStars 100s linear infinite;
    }
    @keyframes moveStars { from { background-position: 0 0; } to { background-position: 0 10000px; } }

    .container { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); letter-spacing: 5px; }

    .status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; }
    .badge { display: flex; align-items: center; gap: 8px; border: 1px solid var(--neon-cyan); padding: 5px 10px; color: var(--neon-cyan); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon-cyan); }
    .dot.stale { background: #ff4444; box-shadow: 0 0 10px #ff4444; }

    .card {
      background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
      border-left: 4px solid var(--neon-purple); padding: 20px; margin-bottom: 20px;
    }
    .card-title { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--neon-cyan); margin-bottom: 15px; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; }

    .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .sensor-item { text-align: center; padding: 15px; background: rgba(0,0,0,0.3); }
    .sensor-value { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: white; }
    .sensor-unit { font-size: 0.8rem; color: var(--neon-cyan); }

    .motor-tag { flex: 1; padding: 10px; text-align: center; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: bold; border-radius: 4px; }
    .motor-tag.on { background: rgba(0, 242, 255, 0.2); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
    .motor-tag.off { background: rgba(255, 255, 255, 0.05); border: 1px solid #444; color: #666; }

    .ai-body { font-size: 0.9rem; line-height: 1.6; color: #ccd0ff; }
  </style>
</head>
<body>

<div class="stars"></div>

<div class="container">
  <header>
    <h1>STATION LAVENDER</h1>
  </header>

  <div class="status-bar">
    <div class="badge"><div class="dot" id="dotEl"></div> <span id="statusText">WAITING DATA</span></div>
    <div id="lastUpdateEl">SYNCING...</div>
  </div>

  <div class="card">
    <div class="card-title">TELEMETRY</div>
    <div class="sensor-grid">
      <div class="sensor-item">
        <div style="font-size: 0.7rem; color: #88f;">TEMP</div>
        <div class="sensor-value" id="tempEl">--<span class="sensor-unit">°C</span></div>
      </div>
      <div class="sensor-item">
        <div style="font-size: 0.7rem; color: #88f;">HUMID</div>
        <div class="sensor-value" id="humEl">--<span class="sensor-unit">%</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">ACTUATORS</div>
    <div style="display: flex; gap: 10px;">
      <div class="motor-tag off" id="fanTag">🌀 FAN</div>
      <div class="motor-tag off" id="pumpTag">💧 PUMP</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">GEMINI ADVISORY</div>
    <div class="ai-body" id="aiBody">센서 데이터를 기다리는 중입니다...</div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  async function fetchLatest() {
    try {
      // Flask 서버의 /api/latest 엔드포인트 호출
      const res = await fetch('/api/latest', { cache: 'no-store' });
      const data = await res.json();

      // 1. 센서값 업데이트 (temperature, humidity)
      if (data.temperature !== undefined) {
        $('tempEl').innerHTML = `${parseFloat(data.temperature).toFixed(1)}<span class="sensor-unit">°C</span>`;
        $('humEl').innerHTML = `${parseFloat(data.humidity).toFixed(1)}<span class="sensor-unit">%</span>`;
      }

      // 2. AI 결과 파싱 (result 내의 JSON 문자열 분석)
      if (data.result) {
        try {
          // 백엔드에서 result는 문자열 형태의 JSON이므로 파싱 필요
          const aiJson = JSON.parse(data.result);
          
          $('aiBody').textContent = aiJson.advice || "정상 작동 중";
          
          // 모터 상태 업데이트
          const isFanOn = aiJson.fan === "ON";
          const isPumpOn = aiJson.pump === "ON";

          $('fanTag').className = 'motor-tag ' + (isFanOn ? 'on' : 'off');
          $('pumpTag').className = 'motor-tag ' + (isPumpOn ? 'on' : 'off');
        } catch (e) {
          // JSON 형식이 아닐 경우 텍스트 그대로 출력
          $('aiBody').textContent = data.result;
        }
      }

      // 3. 상태 표시
      $('statusText').textContent = "STATION ACTIVE";
      $('dotEl').className = "dot";
      if (data.timestamp) {
        $('lastUpdateEl').textContent = `LAST SYNC: ${new Date().toLocaleTimeString()}`;
      }

    } catch (err) {
      console.error("Fetch error:", err);
      $('statusText').textContent = "OFFLINE";
      $('dotEl').className = "dot stale";
    }
  }

  // 5초마다 데이터 갱신
  setInterval(fetchLatest, 5000);
  window.onload = fetchLatest;
</script>
</body>
</html>
